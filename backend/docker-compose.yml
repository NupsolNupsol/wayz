# Secrets never live in this file. Every sensitive value below is an interpolation that Compose
# resolves from the host environment or from backend/.env (git-ignored) at `docker compose up`
# time. backend/.env.example documents the full set with safe placeholders.
#
# Note the deliberate asymmetry: MONGODB_URI / REDIS_URL are hardcoded to the Compose SERVICE
# NAMES here, and are NOT interpolated from .env. The .env file holds the localhost URLs the
# backend needs when it runs directly on the host; pulling those into the API container would
# point it at itself. Infrastructure wiring belongs to Compose, credentials belong to .env.

services:
  mongo:
    image: mongo:7
    container_name: lockerflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lockerflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The vector index behind the employee AI assistant. Its data is a named volume, so a
  # rebuild does not mean re-embedding every knowledge document.
  #
  # The port is bound to 127.0.0.1 deliberately: Qdrant has no authentication by default and
  # a dashboard that will happily list every collection. Nothing outside this host needs to
  # reach it — the AI service talks to it over the Compose network by service name.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: lockerflow-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      # List syntax, and no default, on purpose: Qdrant switches authentication ON the moment
      # this variable EXISTS — an empty value is still a value, and every request then gets a
      # 401. Written this way the variable is absent unless a deployment sets one, which is
      # the correct default for a port bound to 127.0.0.1 on an internal network.
      - QDRANT__SERVICE__API_KEY
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant's image has no curl or wget; its own binary answers this.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      # The platform root: the API's package.json depends on ../workflow, which is outside
      # backend/ and therefore has to be inside the build context.
      context: ..
      dockerfile: backend/Dockerfile
    container_name: lockerflow-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      learning-ai:
        # started, not healthy: the AI service is reachable long before BGE-M3 has finished
        # loading, and the booking API must not wait on a model to start taking bookings.
        condition: service_started
    environment:
      # --- Docker infrastructure: fixed, container-only. Never read from .env. ----------
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/lockerflow
      REDIS_URL: redis://redis:6379
      # Mode-specific, like the URLs above: the host runs the sweep on an in-process timer and
      # does not seed a throwaway database, this stack has a real Redis and a fresh volume.
      QUEUE_ENABLED: "true"
      AUTO_SEED: "false"

      # --- Environment-specific: overridable, safe non-secret defaults. -----------------
      # Both browsers that talk to this API in development: the web workspace and the Expo
      # web preview. The default is the full list, so a .env that names only one origin is
      # still the thing that widens or narrows it — it never silently drops the second.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5175,http://localhost:8081}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5175}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      EXPIRY_WARNING_MINUTES: ${EXPIRY_WARNING_MINUTES:-15}

      # --- The control plane's first administrator. --------------------------------------
      # Read once at boot: if no platform administrator exists, one is created from these.
      # There is no public signup, so this is the only way the first one comes into being.
      # Unset, the API starts and says plainly that it has not been bootstrapped.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Platform Administrator}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}

      # --- What this deployment is for. -------------------------------------------------
      # MODE says who the server is for, not how it was built: `dev` is a server a test team uses,
      # `live` is one customers reach. STATIC_OTP is a confirmation code that always works, and it
      # is honoured only when MODE is dev. Both default to the safe answer, so a stack started
      # without them has no standing code at all.
      MODE: ${MODE:-live}
      STATIC_OTP: ${STATIC_OTP:-}

      # --- Demo / test affordances. -----------------------------------------------------
      # These expose data that production must not hand out: OTP_TEST_PEEK opens the endpoint
      # that returns a live OTP, INVITE_TEST_PEEK returns the staff invitation link in the API
      # response, DEMO_SCANNER returns parcel barcodes so the UI can fake a hardware scan.
      # They default to true here because this Compose stack is the demo environment; set them
      # to false in the host environment for any deployment that real customers can reach.
      # Lists each tenant's own seeded accounts on its sign-in screen. Demo stacks only.
      DEMO_LOGINS: ${DEMO_LOGINS:-true}
      OTP_TEST_PEEK: ${OTP_TEST_PEEK:-true}
      INVITE_TEST_PEEK: ${INVITE_TEST_PEEK:-true}
      DEMO_SCANNER: ${DEMO_SCANNER:-true}
      # The testing clock: ages one booking so an overtime rule can be seen to fire without
      # waiting an hour for it. Demo only — never set this where customers can reach the app.
      DEMO_TIME_TRAVEL: ${DEMO_TIME_TRAVEL:-true}
      # WhatsApp fetches an invoice PDF itself, so it needs an address it can reach. Point this
      # at a tunnel in development; unset, the send explains why it could not go.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}

      # --- Secrets and credentials: supplied by the host environment / backend/.env. -----
      # JWT_SECRET has no default on purpose — Compose refuses to start without it rather
      # than silently signing tokens with a key that is public in this repository.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in backend/.env (see .env.example)}

      # Where the learning/AI service is, and the separate secret used to sign the
      # short-lived actor token sent with every call to it. Unset, the assistant is simply
      # off: the API says so and no employee-facing feature breaks.
      AI_SERVICE_URL: http://learning-ai:8088
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-60000}

      # Vonage WhatsApp OTP. Unset leaves OTP delivery in mock mode.
      VONAGE_API_KEY: ${VONAGE_API_KEY:-}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET:-}
      VONAGE_WHATSAPP_NUMBER: ${VONAGE_WHATSAPP_NUMBER:-}
      # SMS goes to the live Messages API; WhatsApp stays on the sandbox. Two endpoints
      # because the sandbox carries social channels only and cannot send SMS at all.
      VONAGE_MESSAGES_URL: ${VONAGE_MESSAGES_URL:-https://api.nexmo.com/v1/messages}
      VONAGE_WHATSAPP_URL: ${VONAGE_WHATSAPP_URL:-https://messages-sandbox.nexmo.com/v1/messages}
      VONAGE_SMS_FROM: ${VONAGE_SMS_FROM:-WAYZ}

      # Primary SMTP (email OTP channel).
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WAYZ}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      SENDER_PASSWORD: ${SENDER_PASSWORD:-}

      # Fallback SMTP, tried when the primary refuses or times out.
      MAIL_FALLBACK_HOST: ${MAIL_FALLBACK_HOST:-}
      MAIL_FALLBACK_PORT: ${MAIL_FALLBACK_PORT:-465}
      MAIL_FALLBACK_SECURE: ${MAIL_FALLBACK_SECURE:-true}
      MAIL_FALLBACK_USER: ${MAIL_FALLBACK_USER:-}
      MAIL_FALLBACK_PASSWORD: ${MAIL_FALLBACK_PASSWORD:-}
    ports:
      - "4000:4000"

  # The Python learning/AI service. Separate process, separate image, separate language —
  # RAG, embeddings and speech have nothing to do with the booking API and would drag torch
  # into it. The browser never reaches this; only the API above does, over the internal
  # network, and no port is published.
  learning-ai:
    build:
      context: ../learning-ai-service
      dockerfile: Dockerfile
      target: runtime
    container_name: lockerflow-learning-ai
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      # --- Docker infrastructure: fixed, container-only. Never read from .env. ----------
      ENVIRONMENT: production
      PORT: 8088
      QDRANT_URL: http://qdrant:6333
      MONGODB_URI: mongodb://mongo:27017
      AI_DB_NAME: lockerflow_ai

      # --- The shared secret, the same one the API signs with. -------------------------
      # No default, like JWT_SECRET above: a service that cannot tell LockerFlow from anyone
      # else who can reach the port should refuse to start rather than trust everybody.
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?AI_SERVICE_SECRET is required — set it in backend/.env (see .env.example)}
      QDRANT_API_KEY: ${QDRANT__SERVICE__API_KEY:-}

      # --- OpenAI. Answer generation only; embeddings are local and cost nothing. -------
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_API_STYLE: ${OPENAI_API_STYLE:-responses}

      # --- Local models. ---------------------------------------------------------------
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      TTS_PROVIDER: ${TTS_PROVIDER:-piper}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.30}
    volumes:
      # BGE-M3 is ~2.3 GB and is downloaded on first use. In a volume it survives every
      # rebuild; in a layer it would be re-fetched whenever the image changed.
      - ai_models:/models/hf
      - ai_tts_cache:/var/cache/lockerflow-tts

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
  ai_models:
  ai_tts_cache:
