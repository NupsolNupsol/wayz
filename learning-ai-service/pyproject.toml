[project]
name = "lockerflow-learning-ai"
version = "1.0.0"
description = "Tenant-aware Arabic RAG, knowledge ingestion and local TTS for LockerFlow"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "W"]
ignore = [
  # Every `except Exception` here is deliberate and logged: a provider failing must become a
  # refusal the caller can read, never an unhandled 500 with a traceback in it.
  "BLE001",
  # Assert is how pytest asserts.
  "S101",
  "E501",
  # FastAPI's documented signature *is* `x = Depends(...)` / `Query(...)` / `File(...)`.
  # This rule is right about Python in general and wrong about this framework.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/services/tts/piper.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
